<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Notes App — DevOps TP06</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f0;
      color: #222;
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    input[name=title] {
      flex: 1;
      min-width: 200px;
    }

    button {
      padding: 8px 16px;
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #0F6E56;
    }

    .note {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: start;
    }

    .note-body h3 {
      margin-bottom: 4px;
    }

    .note-body p {
      color: #666;
      font-size: 14px;
    }

    .del {
      background: none;
      border: none;
      color: red;
      font-size: 18px;
      cursor: pointer;
    }

    .status {
      font-size: 12px;
      color: #666;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>

  <h1>Notas — DevOps Portfolio</h1>

  <p class="status" id="status">Cargando...</p>

  <div class="form">
    <input id="title" placeholder="Título de la nota">

    <input id="content" placeholder="Contenido">

    <button onclick="addNote()">
      Agregar
    </button>
  </div>

  <div id="notes"></div>

  <script>

    const API = "/api";

    async function load() {

      const r = await fetch(API + "/notes");

      const notes = await r.json();

      document.getElementById("notes").innerHTML =
        notes.map(n => `
          <div class="note">
            <div class="note-body">
              <h3>${n.title}</h3>

              <p>
                ${n.content || ""}
              </p>
            </div>

            <button class="del" onclick="del(${n.id})">
              ×
            </button>
          </div>
        `).join("");

      checkHealth();
    }

    async function addNote() {

      const title =
        document.getElementById("title").value.trim();

      if (!title) return;

      await fetch(API + "/notes", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          title,
          content: document.getElementById("content").value
        })
      });

      document.getElementById("title").value = "";
      document.getElementById("content").value = "";

      load();
    }

    async function del(id) {

      await fetch(API + "/notes/" + id, {
        method: "DELETE"
      });

      load();
    }

    async function checkHealth() {

      const r =
        await fetch("/health");

      const d =
        await r.json();

      document.getElementById("status").textContent =
        `Backend: ${d.status} | DB: ${d.db}`;
    }

    load();

  </script>

</body>
</html>
