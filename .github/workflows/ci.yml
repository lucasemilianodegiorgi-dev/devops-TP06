name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v

      - name: Run flake8
        run: |
          cd backend
          flake8 . --exclude=venv,__pycache__ --max-line-length=100 --ignore=E302,E305,E401,E402

  docker:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
